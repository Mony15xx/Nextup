<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T</title>
<meta name="theme-color" content="#F7CD3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="T">
<link id="favicon" rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 300'%3E%3Crect width='300' height='300' rx='34' fill='%23F7CD3A'/%3E%3Cpath fill='%232b2b2b' d='M60 60h180v60H180v120H120V120H60z'/%3E%3C/svg%3E">
<style>
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: #ececec; }
  #logo { width: min(70vmin, 320px); height: auto; display: block; }
</style>
</head>
<body>

<svg id="logo" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="T logo"></svg>

<script>
  /* ---- Height map -------------------------------------------------------
     5x5 grid of 60px tiles. A tile's height decides BOTH its flat colour
     (lighter = higher) and the shadows it casts (light from the top-left).
     Dark T tiles are 0–1 (lowest), yellow tiles are 2–6.
  ---------------------------------------------------------------------- */
  const H0 = [
    [3.4, 4.6, 2.6, 5.2, 3.9],
    [5.8, 0.9, 0.3, 0.65, 2.2],
    [4.2, 5.5, 0.1, 3.1, 4.9],
    [2.9, 3.6, 0.5, 5.0, 2.4],
    [4.4, 3.2, 5.9, 2.7, 4.0]
  ];
  // Yellow tiles: keep only 35% of their spread around the average
  // (affects both their shade and their height). The dark T is untouched.
  const SPREAD = 0.35;
  const yellow = H0.flat().filter(v => v >= 1.5);
  const mean = yellow.reduce((a, b) => a + b, 0) / yellow.length;
  const H = H0.map(row => row.map(v => v < 1.5 ? v : mean + (v - mean) * SPREAD));

  const N = 5, S = 60;
  const K = 1.7;          // pixels of shadow reach per unit of height difference
  const SHADOW = 0.32;    // shadow darkness
  const BLUR = 3.5;       // shadow softness
  const HILITE = 0.5;     // corner highlight strength
  const GLOW = 38;        // corner highlight size in px
  const T_SHADOW = 1.15;  // the T's shadows are 15% darker
  const RIM_BLUR = 0.8;   // smoothness of the rim light
  const RIM = 0.25;        // crisp edge line strength

  const hex = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));
  const mix = (a, b, t) => "#" + hex(a).map((v, i) =>
    Math.round(v + (hex(b)[i] - v) * t).toString(16).padStart(2, "0")).join("");

  // flat colour from height: dark ramp for the T, yellow ramp for the rest
  const colorOf = h => h < 1.5
    ? mix("#262626", "#4a4a4a", Math.min(h, 1))
    : mix("#E6B22A", "#FFE35C", (h - 2) / 4);

  // Physical height: the dark T stands above the yellow tiles
  // (H above only drives each tile's colour)
  // The T's own height differences are reduced by 30%, and the whole T sits
  // just above the highest yellow tile.
  const T_SPREAD = 0.7;   // keep 70% of the height differences inside the T
  const T_GAP = 0.4;      // how far the lowest T tile sits above the highest yellow tile
  const tVals = H.flat().filter(v => v < 1.5);
  const tMean = tVals.reduce((a, b) => a + b, 0) / tVals.length;
  const tComp = v => tMean + (v - tMean) * T_SPREAD;
  const yMax = Math.max(...H.flat().filter(v => v >= 1.5));
  const tOffset = yMax + T_GAP - Math.min(...tVals.map(tComp));
  const HT = H.map(row => row.map(v => v < 1.5 ? tComp(v) + tOffset : v));
  const h = (r, c) => (r >= 0 && c >= 0 && r < N && c < N) ? HT[r][c] : -Infinity;

  let defs = '<clipPath id="round"><rect width="300" height="300" rx="34"/></clipPath>'
    + `<filter id="rimSoft" filterUnits="userSpaceOnUse" x="-100" y="-100" width="500" height="500"><feGaussianBlur stdDeviation="${RIM_BLUR}"/></filter>`
    + `<filter id="soft" filterUnits="userSpaceOnUse" x="-100" y="-100" width="500" height="500"><feGaussianBlur stdDeviation="${BLUR}"/></filter>`
    + `<radialGradient id="glow" cx="0" cy="0" r="1">`
    + `<stop offset="0" stop-color="#fff" stop-opacity="${HILITE}"/>`
    + `<stop offset=".25" stop-color="#fff" stop-opacity="${HILITE * 0.6}"/>`
    + `<stop offset=".55" stop-color="#fff" stop-opacity="${HILITE * 0.2}"/>`
    + `<stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>`
    + `<linearGradient id="rimTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".26"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>`
    + `<linearGradient id="rimLeft" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".26"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>`;
  let tiles = "", shadows = "", lights = "";

  for (let r = 0; r < N; r++) {
    for (let c = 0; c < N; c++) {
      const x = c * S, y = r * S;
      tiles += `<rect x="${x}" y="${y}" width="${S}" height="${S}" fill="${colorOf(H[r][c])}"/>`;
      defs += `<clipPath id="t${r}${c}"><rect x="${x}" y="${y}" width="${S}" height="${S}"/></clipPath>`;
    }
  }

  // Shadows: every higher tile projects its footprint down-right onto lower tiles
  for (let br = 0; br < N; br++) {
    for (let bc = 0; bc < N; bc++) {
      let rects = "", rectsT = "";
      for (const [dr, dc] of [[0, -1], [-1, 0], [-1, -1]]) {   // tiles up-left of B
        const ar = br + dr, ac = bc + dc;
        if (h(ar, ac) > HT[br][bc]) {
          const d = Math.min((HT[ar][ac] - HT[br][bc]) * K, S);
          const rect = `<rect x="${ac * S + d}" y="${ar * S + d}" width="${S}" height="${S}"/>`;
          if (H[ar][ac] < 1.5) rectsT += rect; else rects += rect;   // T shadows are darker
        }
      }
      let inner = "";
      if (rects)  inner += `<g filter="url(#soft)" fill="#000" opacity="${SHADOW}">${rects}</g>`;
      if (rectsT) inner += `<g filter="url(#soft)" fill="#000" opacity="${SHADOW * T_SHADOW}">${rectsT}</g>`;
      if (inner) shadows += `<g clip-path="url(#t${br}${bc})">${inner}</g>`;
    }
  }

  // Highlights: a tile that is high (casts a shadow) and has nothing higher
  // toward the top-left gets a subtle light on its top-left corner
  for (let r = 0; r < N; r++) {
    for (let c = 0; c < N; c++) {
      const me = HT[r][c];
      const nothingHigherUpLeft = h(r, c - 1) <= me && h(r - 1, c) <= me && h(r - 1, c - 1) <= me;
      const castsShadow = h(r, c + 1) < me || h(r + 1, c) < me || h(r + 1, c + 1) < me;
      if (nothingHigherUpLeft && castsShadow) {
        const x = c * S, y = r * S;
        // crisp thin rim exactly on the top and left edges
        lights += `<path d="M${x + 0.75} ${y + S}V${y + 0.75}H${x + S}" fill="none" stroke="#fff" stroke-opacity="${RIM}" stroke-width="1.5" filter="url(#rimSoft)"/>`;
      }
    }
  }

  const svg = document.getElementById("logo");
  svg.innerHTML = `<defs>${defs}</defs><g clip-path="url(#round)">${tiles}${shadows}${lights}</g>`;

  const XMLNS = 'xmlns="http://www.w3.org/2000/svg"';
  const dataUri = s => "data:image/svg+xml," + encodeURIComponent(s);

  // Tab icon: the same flat tiles and shade values, without shadows or rim light
  const flatIcon = `<svg ${XMLNS} viewBox="0 0 300 300"><defs><clipPath id="round"><rect width="300" height="300" rx="34"/></clipPath></defs><g clip-path="url(#round)">${tiles}</g></svg>`;
  document.getElementById("favicon").href = dataUri(flatIcon);

  // Home-screen / app icon: the full 3D version as a PNG.
  // iOS rounds the corners itself, so this one is a full square.
  const appIconSvg = size =>
    `<svg ${XMLNS} width="${size}" height="${size}" viewBox="0 0 300 300"><defs>${defs}</defs>${tiles}${shadows}${lights}</svg>`;

  const renderPng = size => new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const cv = document.createElement("canvas");
      cv.width = cv.height = size;
      cv.getContext("2d").drawImage(img, 0, 0, size, size);
      resolve(cv.toDataURL("image/png"));
    };
    img.src = dataUri(appIconSvg(size));
  });

  Promise.all([renderPng(180), renderPng(512)]).then(([p180, p512]) => {
    [["180x180", p180], ["512x512", p512]].forEach(([sizes, href]) => {
      const link = document.createElement("link");
      link.rel = "apple-touch-icon";
      link.sizes = sizes;
      link.href = href;
      document.head.appendChild(link);
    });
  });
</script>
</body>
</html>
