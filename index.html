<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sir Spoon – Save the Princess!</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cinzel:wght@400;700&family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #3d1f05;
    font-family: 'Cinzel', serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    user-select: none;
  }

  /* ── Parchment background ── */
  .bg {
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(ellipse at 20% 50%, #7a3e10 0%, transparent 60%),
      radial-gradient(ellipse at 80% 30%, #5a2d08 0%, transparent 60%),
      #3d1f05;
  }
  .bg::before {
    content: '';
    position: absolute; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.02'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  }

  /* ── Title ── */
  .title {
    position: relative; z-index: 10;
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2.5rem, 7vw, 4rem);
    font-weight: 700;
    color: #ffd700;
    text-align: center;
    text-shadow: 0 0 40px #ffd70099, 0 3px 0 #7a4a00, 0 6px 20px #00000080;
    letter-spacing: 0.18em;
    margin-bottom: 0.3rem;
    line-height: 1;
  }
  .subtitle {
    position: relative; z-index: 10;
    font-family: 'Lora', serif;
    font-style: italic;
    font-size: clamp(0.75rem, 2vw, 0.95rem);
    color: #c8935a;
    text-align: center;
    margin-bottom: 1.5rem;
    letter-spacing: 0.05em;
  }

  /* ── Arena ── */
  .arena {
    position: relative; z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(2rem, 8vw, 5rem);
    padding: 2.5rem 2.5rem 2rem;
    background: linear-gradient(to bottom, #2a1305, #3d1f08);
    border: 2px solid #c8935a;
    border-radius: 16px;
    box-shadow: 0 0 80px #f5a62330, 0 0 30px #f5d07a15, inset 0 0 40px #00000040;
    width: min(860px, 96vw);
    min-height: 360px;
  }

  /* ground line */
  .arena::after {
    content: '';
    position: absolute;
    bottom: 56px; left: 5%; right: 5%;
    height: 2px;
    background: linear-gradient(to right, transparent, #c8935a88, #f5d07a66, #c8935a88, transparent);
  }

  /* ── Characters ── */
  .character {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    flex: 0 0 auto;
    min-width: clamp(120px, 22vw, 180px);
  }

  .char-name {
    font-size: clamp(0.7rem, 1.6vw, 0.85rem);
    color: #f5c070;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    text-shadow: 0 1px 4px #00000060;
  }

  .sprite {
    font-size: clamp(6rem, 16vw, 9rem);
    line-height: 1;
    transition: transform 0.15s ease, filter 0.15s ease;
    cursor: default;
    display: block;
    text-align: center;
  }
  .sprite.shake {
    animation: shake 0.35s ease;
  }
  .sprite.attack-flash {
    animation: attackFlash 0.35s ease;
  }

  /* ── HP Bar ── */
  .hp-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .hp-label {
    font-size: 0.65rem;
    color: #c8935a88;
    letter-spacing: 0.1em;
  }
  .hp-bar-bg {
    width: clamp(110px, 20vw, 150px);
    height: 13px;
    background: #1a0a02;
    border: 1px solid #c8935a;
    border-radius: 6px;
    overflow: hidden;
  }
  .hp-bar {
    height: 100%;
    background: linear-gradient(to right, #8b0000, #e53535);
    border-radius: 6px;
    transition: width 0.4s cubic-bezier(.25,.8,.25,1), background 0.4s;
    width: 100%;
  }
  .hp-bar.low { background: linear-gradient(to right, #5a0000, #c02020); }
  .hp-text {
    font-size: 0.7rem;
    color: #f5d07a;
    letter-spacing: 0.05em;
  }

  /* ── VS divider ── */
  .vs {
    font-size: clamp(1.4rem, 3.5vw, 2rem);
    color: #c8935a;
    font-weight: 700;
    flex: 0 0 auto;
    letter-spacing: 0.1em;
    text-shadow: 0 0 20px #f5a62340;
  }

  /* ── Attack button ── */
  .attack-btn {
    position: relative; z-index: 10;
    margin-top: 1.2rem;
    background: linear-gradient(to bottom, #b85a1a, #7a3510);
    border: 2px solid #f5d07a;
    color: #ffd700;
    font-family: 'Cinzel', serif;
    font-size: clamp(0.9rem, 2.5vw, 1.1rem);
    font-weight: 700;
    letter-spacing: 0.15em;
    padding: 0.75rem 2.8rem;
    border-radius: 8px;
    cursor: pointer;
    box-shadow: 0 4px 24px #00000060, 0 0 20px #f5d07a18, inset 0 1px 0 #ffd70030;
    transition: transform 0.1s, box-shadow 0.1s, background 0.15s;
  }
  .attack-btn:hover {
    background: linear-gradient(to bottom, #d06a22, #924015);
    box-shadow: 0 4px 30px #f5a62360, 0 0 30px #ffd70025, inset 0 1px 0 #ffd70050;
  }
  .attack-btn:active {
    transform: scale(0.96) translateY(2px);
    box-shadow: 0 2px 10px #00000060;
  }
  .attack-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none;
  }

  /* ── Damage floater ── */
  .damage-float {
    position: absolute;
    font-family: 'Cinzel', serif;
    font-size: 1.6rem;
    font-weight: 700;
    color: #ff4444;
    text-shadow: 0 2px 8px #000;
    pointer-events: none;
    animation: floatUp 0.9s ease-out forwards;
    z-index: 100;
  }
  .damage-float.crit { color: #ffd700; font-size: 2rem; }

  /* ── Hit flash overlay ── */
  .hit-flash {
    position: absolute; inset: 0;
    border-radius: 14px;
    pointer-events: none;
    background: #ff000000;
    transition: background 0.1s;
    z-index: 5;
  }
  .hit-flash.active { background: #ff000018; }

  /* ── Win Screen ── */
  .win-screen {
    display: none;
    position: fixed; inset: 0;
    z-index: 999;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(to bottom, #0d0702ee, #1a0e05ee);
    text-align: center;
    padding: 2rem;
    animation: fadeIn 0.6s ease;
  }
  .win-screen.visible { display: flex; }

  .win-title {
    font-size: clamp(2rem, 6vw, 3.5rem);
    color: #f5d07a;
    text-shadow: 0 0 40px #f5a623, 0 3px 0 #7a3a00;
    margin-bottom: 0.5rem;
    animation: scaleIn 0.5s cubic-bezier(.34,1.56,.64,1) 0.2s both;
  }
  .win-sprites {
    font-size: clamp(3.5rem, 10vw, 5rem);
    margin: 0.8rem 0;
    animation: scaleIn 0.5s cubic-bezier(.34,1.56,.64,1) 0.4s both;
  }
  .win-tagline {
    font-family: 'Lora', serif;
    font-style: italic;
    font-size: clamp(0.9rem, 2.5vw, 1.2rem);
    color: #c8935a;
    margin-bottom: 0.4rem;
    animation: fadeIn 0.6s ease 0.7s both;
  }
  .win-movie-title {
    font-size: clamp(1.4rem, 4vw, 2rem);
    color: #f5d07a;
    letter-spacing: 0.2em;
    margin-bottom: 0.3rem;
    animation: fadeIn 0.6s ease 0.9s both;
  }
  .win-coming-soon {
    font-size: clamp(0.7rem, 1.8vw, 0.85rem);
    color: #6b3e10;
    letter-spacing: 0.3em;
    margin-bottom: 1.5rem;
    animation: fadeIn 0.6s ease 1.1s both;
  }
  .play-again-btn {
    background: transparent;
    border: 1.5px solid #c8935a;
    color: #c8935a;
    font-family: 'Cinzel', serif;
    font-size: 0.85rem;
    letter-spacing: 0.15em;
    padding: 0.6rem 2rem;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
    animation: fadeIn 0.6s ease 1.3s both;
  }
  .play-again-btn:hover {
    background: #c8935a20;
    color: #f5d07a;
    border-color: #f5d07a;
  }

  /* ── Confetti canvas ── */
  #confetti-canvas {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 998;
  }

  /* ── Animations ── */
  @keyframes shake {
    0%   { transform: translateX(0); }
    20%  { transform: translateX(12px) rotate(5deg); }
    40%  { transform: translateX(-10px) rotate(-4deg); }
    60%  { transform: translateX(8px) rotate(3deg); }
    80%  { transform: translateX(-6px); }
    100% { transform: translateX(0) rotate(0); }
  }
  @keyframes attackFlash {
    0%   { transform: translateX(0) scaleX(1); filter: brightness(1); }
    30%  { transform: translateX(30px) scaleX(1.15); filter: brightness(1.4); }
    60%  { transform: translateX(20px) scaleX(1.05); filter: brightness(1.2); }
    100% { transform: translateX(0) scaleX(1); filter: brightness(1); }
  }
  @keyframes floatUp {
    0%   { opacity: 1; transform: translateY(0) scale(1); }
    50%  { opacity: 1; transform: translateY(-40px) scale(1.1); }
    100% { opacity: 0; transform: translateY(-80px) scale(0.9); }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  @keyframes scaleIn {
    from { opacity: 0; transform: scale(0.5); }
    to   { opacity: 1; transform: scale(1); }
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.3; }
  }

  /* ── Instruction ── */
  .instruction {
    position: relative; z-index: 10;
    font-family: 'Lora', serif;
    font-style: italic;
    font-size: clamp(0.7rem, 1.8vw, 0.82rem);
    color: #c8935a;
    margin-top: 0.8rem;
    letter-spacing: 0.06em;
    animation: blink 2.5s ease-in-out infinite;
  }
</style>
</head>
<body>

<div class="bg"></div>

<canvas id="confetti-canvas"></canvas>

<p class="title">⚔️ Sir Spoon ⚔️</p>
<p class="subtitle">A tale of bravery, cutlery, and true love</p>

<div class="arena" id="arena">
  <div class="hit-flash" id="hit-flash"></div>

  <!-- KNIGHT -->
  <div class="character">
    <span class="char-name">Sir Spoon</span>
    <span class="sprite" id="knight-sprite" title="Knight Spoon">🥄</span>
  </div>

  <span class="vs">VS</span>

  <!-- FORK -->
  <div class="character">
    <span class="char-name">The Evil Fork</span>
    <span class="sprite" id="fork-sprite" title="Evil Fork">🍴</span>
    <div class="hp-wrap">
      <span class="hp-label">VILLAIN HP</span>
      <div class="hp-bar-bg">
        <div class="hp-bar" id="hp-bar"></div>
      </div>
      <span class="hp-text" id="hp-text">100 / 100</span>
    </div>
  </div>
</div>

<button class="attack-btn" id="attack-btn" onclick="attack()">⚔️ ATTACK! ⚔️</button>
<p class="instruction" id="instruction">Click the button or tap anywhere to strike!</p>

<!-- WIN SCREEN -->
<div class="win-screen" id="win-screen">
  <div class="win-title">🏆 Victory! 🏆</div>
  <div class="win-sprites" id="win-sprites">🥄💕🥄</div>
  <p class="win-tagline" id="win-message">"The princess is saved! The cutlery drawer rejoices!"</p>
  <p class="win-movie-title">SIR SPOON</p>
  <p class="win-coming-soon">COMING SOON</p>
  <button class="play-again-btn" onclick="resetGame()">↩ &nbsp; Play Again</button>
</div>

<script>
/* ── Game State ── */
const MAX_HP = 100;
let hp = MAX_HP;
let gameOver = false;
let attackCooldown = false;

/* ── Sprites (emoji placeholders — swap src for your images) ── */
const SPRITES = {
  knightIdle:   '🥄',   /* REPLACE: <img src="knight_idle.png"> */
  knightAttack: '⚔️',   /* REPLACE: <img src="knight_attack.png"> */
  knightWin:    '🏅',   /* REPLACE: <img src="knight_win.png"> */
  forkIdle:     '🍴',   /* REPLACE: <img src="fork_idle.png"> */
  forkHurt:     '😵',   /* REPLACE: <img src="fork_hurt.png"> */
  forkDead:     '💀',   /* REPLACE: <img src="fork_dead.png"> */
};

const knightEl = document.getElementById('knight-sprite');
const forkEl   = document.getElementById('fork-sprite');
const hpBar    = document.getElementById('hp-bar');
const hpText   = document.getElementById('hp-text');
const btn      = document.getElementById('attack-btn');
const hitFlash = document.getElementById('hit-flash');
const winScreen= document.getElementById('win-screen');
const winMsg   = document.getElementById('win-message');

/* ── Attack Logic ── */
function attack() {
  if (gameOver || attackCooldown) return;
  attackCooldown = true;

  const dmg = Math.floor(Math.random() * 18) + 8; // 8–25 damage
  const isCrit = dmg >= 22;
  hp = Math.max(0, hp - dmg);

  /* Knight attack animation */
  knightEl.textContent = SPRITES.knightAttack;
  knightEl.classList.add('attack-flash');

  /* Fork hurt animation */
  forkEl.textContent = SPRITES.forkHurt;
  forkEl.classList.add('shake');

  /* Flash arena */
  hitFlash.classList.add('active');
  setTimeout(() => hitFlash.classList.remove('active'), 120);

  /* Damage floater */
  spawnDamageFloat(dmg, isCrit);

  /* Update HP bar */
  updateHP();

  /* Reset sprites after animation */
  setTimeout(() => {
    knightEl.classList.remove('attack-flash');
    forkEl.classList.remove('shake');
    knightEl.textContent = SPRITES.knightIdle;

    if (hp <= 0) {
      handleWin();
    } else {
      forkEl.textContent = SPRITES.forkIdle;
      attackCooldown = false;
    }
  }, 380);
}

function updateHP() {
  const pct = (hp / MAX_HP) * 100;
  hpBar.style.width = pct + '%';
  hpText.textContent = hp + ' / ' + MAX_HP;
  if (pct <= 30) hpBar.classList.add('low');
}

function spawnDamageFloat(dmg, crit) {
  const arena = document.getElementById('arena');
  const rect  = arena.getBoundingClientRect();
  const fork  = forkEl.getBoundingClientRect();

  const el = document.createElement('div');
  el.className = 'damage-float' + (crit ? ' crit' : '');
  el.textContent = (crit ? '💥 ' : '') + '-' + dmg;
  el.style.left = (fork.left - rect.left + fork.width / 2 - 30) + 'px';
  el.style.top  = (fork.top  - rect.top  - 10) + 'px';
  arena.appendChild(el);
  setTimeout(() => el.remove(), 950);
}

/* ── Win sequence ── */
function handleWin() {
  gameOver = true;
  btn.disabled = true;
  document.getElementById('instruction').style.display = 'none';

  forkEl.textContent = SPRITES.forkDead;
  knightEl.textContent = SPRITES.knightWin;

  setTimeout(() => {
    winScreen.classList.add('visible');
    startConfetti();
  }, 900);
}

/* ── Reset ── */
function resetGame() {
  hp = MAX_HP;
  gameOver = false;
  attackCooldown = false;
  knightEl.textContent = SPRITES.knightIdle;
  forkEl.textContent   = SPRITES.forkIdle;
  hpBar.style.width    = '100%';
  hpBar.classList.remove('low');
  hpText.textContent   = MAX_HP + ' / ' + MAX_HP;
  btn.disabled         = false;
  winScreen.classList.remove('visible');
  document.getElementById('instruction').style.display = '';
  stopConfetti();
}

/* ── Tap anywhere ── */
document.addEventListener('click', (e) => {
  if (!e.target.closest('.win-screen') && !e.target.closest('.attack-btn')) {
    attack();
  }
});

/* ── Confetti ── */
const canvas = document.getElementById('confetti-canvas');
const ctx    = canvas.getContext('2d');
let confettiPieces = [];
let confettiAnim   = null;
let confettiActive = false;

function startConfetti() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  confettiPieces = [];
  confettiActive = true;

  const colors = ['#f5d07a','#c8935a','#e53535','#f5a623','#ffffff','#ffd700','#ff6b6b'];
  for (let i = 0; i < 160; i++) {
    confettiPieces.push({
      x:    Math.random() * canvas.width,
      y:    Math.random() * -canvas.height,
      w:    Math.random() * 10 + 5,
      h:    Math.random() * 6 + 3,
      r:    Math.random() * Math.PI * 2,
      dr:   (Math.random() - 0.5) * 0.15,
      vy:   Math.random() * 3 + 2,
      vx:   (Math.random() - 0.5) * 2,
      color: colors[Math.floor(Math.random() * colors.length)],
      opacity: 1,
    });
  }

  function drawFrame() {
    if (!confettiActive) { ctx.clearRect(0, 0, canvas.width, canvas.height); return; }
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let alive = 0;
    for (const p of confettiPieces) {
      p.y  += p.vy;
      p.x  += p.vx;
      p.r  += p.dr;
      if (p.y > canvas.height + 20) {
        p.y = -20;
        p.x = Math.random() * canvas.width;
        alive++;
      } else { alive++; }
      ctx.save();
      ctx.globalAlpha = p.opacity;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.r);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      ctx.restore();
    }
    confettiAnim = requestAnimationFrame(drawFrame);
  }
  drawFrame();
}

function stopConfetti() {
  confettiActive = false;
  if (confettiAnim) cancelAnimationFrame(confettiAnim);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}

window.addEventListener('resize', () => {
  if (confettiActive) { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
});
</script>
</body>
</html>
