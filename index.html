<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nextup</title>
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nextup">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23ffd400'/%3E%3Ctext x='16' y='22.5' font-family='Poppins,Arial,sans-serif' font-weight='700' font-size='21' text-anchor='middle' fill='%232b1200'%3EN%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23ffd400'/%3E%3Ctext x='16' y='22.5' font-family='Poppins,Arial,sans-serif' font-weight='700' font-size='21' text-anchor='middle' fill='%232b1200'%3EN%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000000; --bg-card:#111111; --bg-elev:#1a1a1a; --border:#3a3a3a;
  --text:#eef0f3; --text-dim:#8b93a3; --heading:#c7cddb;
  --accent:#ffd400; --accent-dark:#4a3d00;
  --complete:#a855f7;
  --progress:var(--accent);
  --amber:#ffc247; --amber-dark:#4a3512;
  --imdb:#f5c518; --rt:#fa320a;
  --green:#66cc00; --red:#ff3f3f;
  --rw-inc:var(--green); --rw-dec:var(--red);
  --radius:16px;
  --page-width:72%;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#303030;color:var(--text);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;scrollbar-width:none;-ms-overflow-style:none}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none}
button,input{font-family:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#shell{display:flex;flex-direction:column;height:100vh;height:100dvh;align-items:center;gap:0}
#main{display:flex;flex-direction:column;min-height:0;flex:1;order:1;width:var(--page-width);max-width:100%;background:var(--bg);margin:0}
#topbar{min-height:56px;border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:10px 20px;gap:14px;flex-shrink:0}
.topbar-search{flex:1;min-width:160px;max-width:460px;display:flex;align-items:center;position:relative}
.topbar-search input{flex:1;min-width:0;padding-right:42px}
.search-btn{position:absolute;right:4px;top:50%;transform:translateY(-50%);flex-shrink:0;width:32px;height:32px;border-radius:50%;border:none;background:transparent;color:var(--text-dim);display:flex;align-items:center;justify-content:center;cursor:pointer}

.search-btn:hover{border-color:var(--accent);color:var(--accent)}
.search-btn svg{width:16px;height:16px}
#bottomnav{order:2;flex-shrink:0;display:flex;align-items:stretch;justify-content:center;gap:7.25%;background:#000;border-top:1px solid var(--border);padding:6px 0 calc(6px + env(safe-area-inset-bottom));width:var(--page-width);max-width:100%;min-height:52px;margin:0}
.nav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:none;border:none;border-radius:10px;padding:6px 4px;text-align:center;font-size:11px;font-weight:600;color:#5a5a5a;cursor:pointer;flex:0 0 15.94%;max-width:15.94%;min-height:40px;transition:color .15s ease}
.nav-item:hover{color:#9a9a9a}
.nav-item.active{background:none;color:#ffffff}
.nav-icon{display:flex;align-items:center;justify-content:center;width:23px;height:23px;flex-shrink:0;color:inherit}
.nav-icon svg{width:100%;height:100%;display:block;stroke:currentColor}
.nav-label{font-size:10px;line-height:1.1;font-weight:600}
.brand{display:flex;align-items:center;gap:10px;font-family:'Poppins',sans-serif;font-weight:700;font-size:19px;flex-shrink:0}
.brand-mark{width:32px;height:32px;border-radius:9px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#2b1200;font-size:21px;font-family:'Poppins',sans-serif;font-weight:700;flex-shrink:0}
input[type=text]{width:100%;background:var(--bg-elev);border:1px solid var(--border);border-radius:999px;padding:10px 16px;font-size:14px}
input[type=text]:focus{border-color:var(--accent)}
input[type=text]:focus,input[type=text]:focus-visible{outline:none}
.topbar-search input:focus,.topbar-search input:focus-visible{outline:none}
.conn-group{display:flex;align-items:center;gap:8px;flex-shrink:0}
.conn{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;padding:7px 12px;border-radius:999px;border:1px solid var(--border);white-space:nowrap}
.conn .dot{width:8px;height:8px;border-radius:50%;background:var(--text-dim)}
.conn.on{border-color:var(--accent-dark);color:var(--accent)}
.conn.on .dot{background:var(--accent);box-shadow:0 0 0 3px var(--accent-dark)}
.conn.err{border-color:var(--red);color:var(--red)}
.conn.err .dot{background:var(--red)}
#outlet{flex:1;overflow-y:auto;padding:28px 20px;scrollbar-width:none;-ms-overflow-style:none}
#outlet::-webkit-scrollbar{display:none}
.sub{color:var(--text-dim);margin:0 0 24px;font-size:14px}
.loading-row{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--text-dim);font-size:14px;margin:0 0 24px;padding:20px 0}
.spinner{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;flex-shrink:0;animation:nx-spin .7s linear infinite}
@keyframes nx-spin{to{transform:rotate(360deg)}}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:18px;max-width:560px}
.card.wide{max-width:none}
.card.wide .row .btn{flex:1}
.card h3{margin-top:0;font-family:'Poppins',sans-serif;font-size:15px}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--text-dim);margin-bottom:14px}
.row{display:flex;gap:10px}
.conn-row input{flex:1}
.conn-row .btn{flex-shrink:0}
.btn{border:1px solid var(--border);background:var(--bg-elev);border-radius:999px;padding:10px 18px;font-size:13px;font-weight:700;cursor:pointer}
.btn:hover{border-color:var(--text-dim)}
.btn-accent{background:var(--accent);border-color:var(--accent);color:#2b1200}
.btn-stopped{background:var(--red);border-color:var(--red);color:#2a0500}
.btn-ghost{background:transparent}
.btn-connect{background:var(--accent);border-color:var(--accent);color:#2b1200;font-weight:800}
.btn-connect:hover{filter:brightness(1.05)}
.btn-disconnect{background:transparent;border-color:var(--red);color:var(--red);font-weight:800}
.btn-disconnect:hover{background:rgba(255,63,63,.12)}
.btn-sm{padding:8px 15px;font-size:14px}
.msg{font-size:13px;margin-top:6px}
.msg:empty{margin-top:0}
.msg.ok{color:var(--accent)} .msg.err{color:var(--red)}
code{background:var(--bg-elev);padding:1px 6px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(184px,1fr));gap:4px}
.poster{background:var(--bg-card);border:1px solid var(--border);border-radius:4px;overflow:hidden;cursor:pointer}
.poster-img-wrap{position:relative;aspect-ratio:2/3;background:var(--bg-elev)}
.poster-img-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.poster-overlay{position:absolute;inset:auto 0 0 0;padding:26px 10px 8px;background:linear-gradient(to top,rgba(0,0,0,.98),transparent)}
.poster-overlay .name{font-size:13px;font-weight:700;line-height:1.25}
.poster-type{position:absolute;top:8px;left:8px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:4px 8px;border-radius:999px;background:rgba(0,0,0,.65);color:var(--text);backdrop-filter:blur(3px);z-index:2}
.poster-rating{position:absolute;top:8px;right:8px;font-size:11px;font-weight:800;padding:4px 8px;border-radius:999px;background:rgba(0,0,0,.65);color:var(--imdb);backdrop-filter:blur(3px);z-index:2;display:flex;align-items:center;gap:3px}
.poster-progress{height:6px;background:var(--border)}
.poster-progress-fill{height:100%;background:var(--progress);transition:width .25s ease,background .25s ease}
.poster-progress-fill.complete{background:var(--complete)}
.poster-progress-fill.stopped{background:var(--rt)}
.check{width:34px;height:34px;border-radius:50%;border:2px solid var(--border);background:var(--bg-elev);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;font-size:18px;color:transparent;margin-right:8px}
.check.on{background:var(--green);border-color:var(--green);color:#0a1a00}
.poster-actions{padding:9px;display:flex;gap:6px;align-items:center}
.poster-actions .btn{flex:1;min-width:0}
.fav-btn{width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:var(--bg-elev);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;color:var(--text-dim);font-size:15px;line-height:1}
.fav-btn:hover{border-color:var(--amber)}
.fav-btn.on{color:var(--amber);border-color:var(--amber-dark);background:var(--amber-dark)}
.rating-chip{display:inline-flex;align-items:center;gap:5px;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;border:1px solid var(--border)}
.rating-chip.imdb{color:var(--imdb);background:#3d3d3d;border:1px solid rgba(255,255,255,.4);padding:8px 18px;font-size:13px}
.feed-item{display:flex;align-items:stretch;background:#000;border:1px solid var(--border);border-radius:8px;margin-bottom:10px;overflow:hidden;height:93px}
.feed-thumb{width:276px;height:100%;align-self:stretch;object-fit:cover;background:var(--bg-elev);flex-shrink:0;border-radius:0 var(--radius) var(--radius) 0}
.feed-content{display:flex;align-items:center;gap:14px;flex:1;min-width:0;padding:10px 12px}
.feed-body{flex:1;min-width:0}
.feed-show{font-size:12px;color:var(--text);font-weight:600}
.feed-title{font-size:15px;font-weight:600;margin-top:3px;color:var(--text-dim);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.feed-meta-row{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.ep-meta{font-size:19px;font-weight:700;color:var(--text)}
.ep-meta.future{color:var(--amber)}
.ep-special-badge{font-size:11px;font-weight:700;letter-spacing:.03em;color:#6a6a6a;background:var(--bg-elev);border:1px solid var(--border);border-radius:6px;padding:2px 7px;text-transform:uppercase}
.pill{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;color:var(--accent);border:1px solid var(--accent-dark);border-radius:6px;padding:3px 7px;display:inline-block}
.pill.future{color:var(--amber);border-color:var(--amber-dark)}
.rating-chip.sm{padding:3px 8px;font-size:10px}
.section-h{font-family:'Poppins',sans-serif;font-weight:600;font-size:18px;color:var(--heading);margin:22px 0 12px}
.section-h.profile-title{color:#fff;font-size:22px}
.section-h.profile-title.sub-page-title{font-size:23px}
.cat-box{display:inline-block;width:auto;background:#767676;border:none;border-radius:999px;padding:6px 16px;text-align:center;font-family:'Poppins',sans-serif;font-weight:700;font-size:11px;line-height:1;letter-spacing:.04em;text-transform:uppercase;color:#ffffff;margin:0 auto 14px;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.cat-box-wrap{text-align:center}
.cat-section{margin-bottom:14px}
.cat-section .grid{margin-bottom:0}
.back{background:#3d3d3d;border:1px solid rgba(255,255,255,.4);color:var(--text);cursor:pointer;font-size:13px;font-weight:700;padding:8px 18px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;flex-shrink:0;box-shadow:0 2px 10px rgba(0,0,0,.35);margin-left:auto}
.back:hover{border-color:var(--accent);color:var(--accent);background:var(--bg-card)}
.title-row{display:flex;align-items:center;justify-content:space-between;gap:14px}
.title-row h2{margin:0}
.lib-popup{position:absolute;top:calc(100% + 8px);left:0;background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:4px;z-index:40;box-shadow:0 12px 32px rgba(0,0,0,.6);min-width:180px}
.lib-popup button{width:100%;text-align:left;white-space:nowrap;background:var(--bg-elev);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:10px 14px;font-size:13px;font-weight:700;cursor:pointer}
.lib-popup button:hover{border-color:var(--text-dim);background:var(--bg)}
.lib-popup .lib-pop-remove{color:var(--red)}
.lib-popup .lib-pop-remove:hover{border-color:var(--red);background:rgba(250,50,10,.1)}
.profile-hero{position:relative;margin:-28px -20px 20px;overflow:visible}
.profile-banner{height:252px;background:var(--bg-elev) center/cover no-repeat;position:relative;filter:brightness(.85)}
.profile-banner::after{content:'';position:absolute;left:0;right:0;bottom:0;height:100px;background:linear-gradient(to bottom,rgba(0,0,0,0) 0%,rgba(0,0,0,.75) 100%);pointer-events:none}
.profile-id-row{position:absolute;left:20px;bottom:16px;display:flex;align-items:center;gap:14px;z-index:2}
.profile-avatar-wrap{position:relative;width:76px;height:76px;flex-shrink:0}
.profile-avatar{width:76px;height:76px;border-radius:50%;object-fit:cover;border:3px solid rgba(0,0,0,.4);background:var(--bg-elev);display:block}
.profile-id-info{display:flex;flex-direction:column;gap:8px}
.profile-id-name{font-family:'Poppins',sans-serif;font-weight:700;font-size:20px;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.profile-edit-btn{align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.03em;padding:6px 16px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;cursor:pointer;backdrop-filter:blur(4px)}
.profile-edit-btn:hover{background:rgba(255,255,255,.2)}
.profile-edit-overlay{position:absolute;left:20px;top:calc(100% + 12px);z-index:5;background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:16px;width:260px;max-width:calc(100% - 40px);box-shadow:0 12px 32px rgba(0,0,0,.5);display:none;flex-direction:column;gap:10px}
.profile-edit-overlay.open{display:flex}
.profile-edit-overlay label.field-btn{display:block;font-size:12px;font-weight:600;padding:9px 12px;border-radius:8px;background:var(--bg-elev);border:1px solid var(--border);cursor:pointer;text-align:center}
.profile-edit-overlay label.field-btn:hover{border-color:var(--accent);color:var(--accent)}
.profile-edit-overlay input[type=text]{width:100%}
.profile-edit-overlay .profile-edit-done{align-self:flex-end;font-size:12px;padding:7px 16px}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-card{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:22px;max-width:360px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.modal-title{font-family:'Poppins',sans-serif;font-weight:700;font-size:17px;color:#fff;margin-bottom:8px}
.modal-message{font-size:14px;color:var(--text-dim);line-height:1.5;margin-bottom:18px}
.modal-actions{display:flex;justify-content:flex-end;gap:10px}

.detail-view{padding:0 0 60px}
#outlet.detail-view{padding-top:0;background:#202020}
.detail-hero-wrap{position:relative;margin:0 -20px 8px;overflow:visible}
.detail-banner{position:absolute;inset:0;background-size:cover;background-position:center 20%;z-index:0;filter:brightness(.85)}
.detail-hero-wrap::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.16) 0%,rgba(0,0,0,.6) 92%);z-index:1;pointer-events:none}
.detail-hero-inner{position:relative;z-index:3;padding:28px 20px 0}
.detail-progress-wrap{padding:14px 0 0;position:relative;z-index:2;max-width:none;width:100%}
.detail-progress{height:10px;background:var(--border);border-radius:0;overflow:hidden;width:100%}
.detail-progress-fill{height:100%;background:var(--progress);transition:width .25s ease,background .25s ease}
.detail-progress-fill.complete{background:var(--complete)}
.detail-progress-fill.uptodate{background:var(--green)}
.detail-progress-fill.stopped{background:var(--rt)}
.detail-body{padding:0;background:#202020}
.hero{display:flex;gap:26px;margin-bottom:18px}
.hero-info{flex:1;min-width:0}
.hero img{width:190px;min-width:190px;height:285px;aspect-ratio:2/3;object-fit:cover;flex:0 0 190px;border-radius:var(--radius);border:1px solid var(--border);box-shadow:0 10px 40px rgba(0,0,0,.45)}
.hero-info h2{font-family:'Poppins',sans-serif;font-weight:700;font-size:26px;margin:0}
.hero-title-row{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin:0 0 8px}
.hero-info p{color:var(--text-dim);font-size:13px;line-height:1.6;max-width:none}
.meta-line{color:var(--text)!important}
.overview-text{color:var(--text)!important}
.overview-text.clamped{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.see-more-btn{display:inline-block;margin-top:4px;background:none;border:none;padding:0;color:var(--accent);font-size:13px;font-weight:700;cursor:pointer}
.see-more-btn:hover{text-decoration:underline}
.hero-ratings{display:flex;gap:10px;margin:0}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px}
.stat-box{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:18px}
.stat-box h3{margin:0 0 14px;font-family:'Poppins',sans-serif;font-size:15px;color:var(--heading)}
.stat-card{background:var(--bg-elev);border:1px solid var(--border);border-radius:12px;padding:14px}
.stat-num{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:700;color:var(--accent)}
.stat-label{font-size:12px;color:var(--text-dim);margin-top:4px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:24px}
.stat-card2{background:#000;border:1px solid var(--border);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;align-items:center;text-align:center}
.stat-card2-head{display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:600;color:var(--text);margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--border);width:100%}
.stat-card2-head svg{width:15px;height:15px;stroke:currentColor;flex-shrink:0}
.stat-parts{display:flex;gap:20px;justify-content:center}
.stat-part{display:flex;flex-direction:column;align-items:center}
.stat-part-num{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:700;color:var(--text);line-height:1}
.stat-part-label{font-size:9px;font-weight:700;letter-spacing:.05em;color:var(--text-dim);margin-top:5px}
.stat-single{font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:700;color:var(--text);text-align:center}
.empty{border:1px dashed var(--border);border-radius:var(--radius);padding:48px 24px;text-align:center;color:var(--text-dim);font-size:14px;max-width:480px;margin:24px auto;display:flex;flex-direction:column;align-items:center;gap:6px;line-height:1.6}
.empty a{cursor:pointer}
.empty-center{display:flex;justify-content:center}
.rewatch-group{display:flex;align-items:center;gap:6px;flex-shrink:0;margin-right:8px}
.rewatch-group.hidden{display:none}
.rewatch-inc{height:34px;background:var(--rw-inc);border-color:var(--rw-inc);color:#0f2b00;font-weight:800}
.rewatch-inc:hover{border-color:var(--rw-inc);filter:brightness(1.05)}
.rewatch-dec{width:34px;height:34px;padding:0;border-radius:50%;font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--rw-dec);border-color:var(--rw-dec);background:transparent}
.rewatch-dec:hover{background:rgba(255,33,52,.14);border-color:var(--rw-dec)}
.rewatch-dec.hidden{display:none}
#toasts{position:fixed;bottom:calc(58px + env(safe-area-inset-bottom));right:20%;left:20%;display:flex;flex-direction:column;align-items:flex-end;gap:8px;z-index:50}
.toast{background:var(--bg-elev);border:1px solid var(--border);border-radius:10px;padding:10px 14px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.toast.err{border-color:var(--red);color:var(--red)}

<script>
const K={apikey:'nx.apikey',omdb:'nx.omdb',token:'nx.token',exp:'nx.exp',lib:'nx.lib',movieLib:'nx.movieLib',watched:'nx.watched',movieWatched:'nx.movieWatched',favShows:'nx.favShows',favMovies:'nx.favMovies',rewatch:'nx.rewatch',epRewatch:'nx.epRewatch',seasonRewatch:'nx.seasonRewatch',profile:'nx.profile',stopped:'nx.stopped'};
function lget(k,f){const r=localStorage.getItem(k);if(r===null)return f;try{return JSON.parse(r)}catch{return f}}
function lset(k,v){localStorage.setItem(k,JSON.stringify(v));scheduleSync()}

function idbOpen(){
  return new Promise((res,rej)=>{
    const req=indexedDB.open('nextup-fs',1);
    req.onupgradeneeded=()=>req.result.createObjectStore('kv');
    req.onsuccess=()=>res(req.result);
    req.onerror=()=>rej(req.error);
  });
}
async function idbGet(key){
  try{
    const db=await idbOpen();
    return await new Promise((res,rej)=>{
      const rq=db.transaction('kv','readonly').objectStore('kv').get(key);
      rq.onsuccess=()=>res(rq.result);
      rq.onerror=()=>rej(rq.error);
    });
  }catch{return null}
}
async function idbSet(key,val){
  try{
    const db=await idbOpen();
    return await new Promise((res,rej)=>{
      const tx=db.transaction('kv','readwrite');
      tx.objectStore('kv').put(val,key);
      tx.oncomplete=()=>res(true);
      tx.onerror=()=>rej(tx.error);
    });
  }catch{return false}
}
function exportDataText(){
  const data={};
  Object.entries(K).forEach(([name,key])=>{
    const raw=localStorage.getItem(key);
    data[name]=raw!==null?JSON.parse(raw):null;
  });
  return JSON.stringify({app:'Nextup',exportedAt:new Date().toISOString(),data},null,2);
}
function importDataText(text){
  const parsed=JSON.parse(text);
  const data=parsed.data||parsed;
  Object.entries(K).forEach(([name,key])=>{
    if(data[name]!==undefined&&data[name]!==null)localStorage.setItem(key,JSON.stringify(data[name]));
  });
}
let syncTimer=null;
function scheduleSync(){
  if(typeof FileSync==='undefined'||!FileSync.handle)return;
  clearTimeout(syncTimer);
  syncTimer=setTimeout(()=>FileSync.save(),400);
}
const FileSync={
  handle:null,
  supported:typeof window!=='undefined'&&'showSaveFilePicker' in window,
  async init(){
    if(!this.supported)return false;
    const h=await idbGet('fileHandle');
    if(!h)return false;
    try{
      const perm=await h.queryPermission({mode:'readwrite'});
      if(perm==='granted'){this.handle=h;return true}
    }catch{}
    this.handle=h;
    return false;
  },
  async chooseOrCreate(){
    if(!this.supported)return false;
    try{
      const h=await window.showSaveFilePicker({suggestedName:'nextup-data.txt',types:[{description:'Text file',accept:{'text/plain':['.txt']}}]});
      this.handle=h;
      await idbSet('fileHandle',h);
      await this.save();
      return true;
    }catch{return false}
  },
  async ensurePermission(){
    if(!this.handle)return false;
    const opts={mode:'readwrite'};
    try{
      if((await this.handle.queryPermission(opts))==='granted')return true;
      if((await this.handle.requestPermission(opts))==='granted')return true;
    }catch{}
    return false;
  },
  async save(){
    if(!this.handle)return false;
    if(!(await this.ensurePermission()))return false;
    try{
      const w=await this.handle.createWritable();
      await w.write(exportDataText());
      await w.close();
      return true;
    }catch{return false}
  },
  async load(){
    if(!this.handle)return null;
    if(!(await this.ensurePermission()))return null;
    try{return await (await this.handle.getFile()).text()}catch{return null}
  }
};
function downloadBackup(){
  const blob=new Blob([exportDataText()],{type:'text/plain'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='nextup-data.txt';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

const Store={
  apikey:()=>lget(K.apikey,''), setApikey:v=>lset(K.apikey,v),
  omdb:()=>lget(K.omdb,''), setOmdb:v=>lset(K.omdb,v),
  token:()=>lget(K.token,''), exp:()=>lget(K.exp,0),
  setSession:(t,ttl)=>{lset(K.token,t);lset(K.exp,Date.now()+ttl)},
  clearSession:()=>{localStorage.removeItem(K.token);localStorage.removeItem(K.exp)},
  clearAll:()=>{[K.apikey,K.token,K.exp].forEach(k=>localStorage.removeItem(k))},
  valid:()=>Boolean(lget(K.token,''))&&Date.now()<lget(K.exp,0),

  _libKey:kind=>kind==='movie'?K.movieLib:K.lib,
  lib:kind=>lget(Store._libKey(kind),{}),
  addLib:(kind,item)=>{const k=Store._libKey(kind);const l=lget(k,{});l[item.id]={...item,addedAt:Date.now()};lset(k,l)},
  rmLib:(kind,id)=>{const k=Store._libKey(kind);const l=lget(k,{});delete l[id];lset(k,l)},
  inLib:(kind,id)=>Boolean(Store.lib(kind)[id]),

  _favKey:kind=>kind==='movie'?K.favMovies:K.favShows,
  fav:kind=>lget(Store._favKey(kind),{}),
  isFav:(kind,id)=>Boolean(Store.fav(kind)[id]),
  toggleFav:(kind,id,data)=>{const k=Store._favKey(kind);const f=lget(k,{});if(f[id])delete f[id];else f[id]={...data,favAt:Date.now()};lset(k,f);return Boolean(f[id])},
  rmFav:(kind,id)=>{const k=Store._favKey(kind);const f=lget(k,{});delete f[id];lset(k,f)},

  watched:()=>lget(K.watched,{}),
  isWatched:id=>Boolean(Store.watched()[id]),
  watchedAt:id=>{const v=Store.watched()[id];return typeof v==='number'?v:(v?Date.now():0)},
  setWatched:(id,v)=>{const w=Store.watched();if(v)w[id]=Date.now();else delete w[id];lset(K.watched,w)},

  movieWatched:()=>lget(K.movieWatched,{}),
  isMovieWatched:id=>Boolean(Store.movieWatched()[id]),
  setMovieWatched:(id,v,extra={})=>{const w=Store.movieWatched();if(v)w[id]={runtime:extra.runtime||100,watchedAt:Date.now()};else delete w[id];lset(K.movieWatched,w)},

  rewatch:()=>lget(K.rewatch,{show:{},movie:{}}),
  getRewatch:(kind,id)=>(Store.rewatch()[kind]||{})[id]||0,
  bumpRewatch:(kind,id)=>{const r=Store.rewatch();if(!r[kind])r[kind]={};r[kind][id]=(r[kind][id]||0)+1;lset(K.rewatch,r);return r[kind][id]},
  decRewatch:(kind,id)=>{const r=Store.rewatch();if(!r[kind])r[kind]={};r[kind][id]=Math.max(0,(r[kind][id]||0)-1);if(r[kind][id]===0)delete r[kind][id];lset(K.rewatch,r);return r[kind][id]||0},

  epRewatch:()=>lget(K.epRewatch,{}),
  getEpRewatch:id=>Store.epRewatch()[id]||0,
  bumpEpRewatch:id=>{const r=Store.epRewatch();r[id]=(r[id]||0)+1;lset(K.epRewatch,r);return r[id]},
  decEpRewatch:id=>{const r=Store.epRewatch();r[id]=Math.max(0,(r[id]||0)-1);if(r[id]===0)delete r[id];else r[id]=r[id];lset(K.epRewatch,r);return r[id]||0},

  seasonRewatch:()=>lget(K.seasonRewatch,{}),
  getSeasonRewatch:key=>Store.seasonRewatch()[key]||0,
  bumpSeasonRewatch:key=>{const r=Store.seasonRewatch();r[key]=(r[key]||0)+1;lset(K.seasonRewatch,r);return r[key]},
  decSeasonRewatch:key=>{const r=Store.seasonRewatch();r[key]=Math.max(0,(r[key]||0)-1);if(r[key]===0)delete r[key];lset(K.seasonRewatch,r);return r[key]||0},

  profile:()=>lget(K.profile,{name:'',avatar:'',banner:''}),
  setProfile:p=>lset(K.profile,{...Store.profile(),...p}),

  stoppedMap:()=>lget(K.stopped,{}),
  isStopped:(kind,id)=>!!Store.stoppedMap()[`${kind}:${id}`],
  setStopped:(kind,id,v)=>{const m=Store.stoppedMap();const key=`${kind}:${id}`;if(v)m[key]=true;else delete m[key];lset(K.stopped,m)},
};
class ApiErr extends Error{constructor(m,s){super(m);this.status=s}}
const Api={
  base:'https://api4.thetvdb.com/v4',
  async login(apikey){
    const body={apikey};
    let res;
    try{res=await fetch(`${this.base}/login`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})}
    catch{throw new ApiErr('Could not reach TheTVDB. Check your connection or an ad-blocker.',0)}
    const j=await res.json().catch(()=>({}));
    if(!res.ok||j.status==='failure')throw new ApiErr(j.message||`Login failed (${res.status})`,res.status);
    Store.setSession(j.data.token,29*24*60*60*1000);
    return j.data.token;
  },
  async _get(path){
    const j=await this._getRaw(path);
    return j.data;
  },
  async _getRaw(path){
    const t=Store.token();
    if(!t)throw new ApiErr('Not connected. Add your API key in your Profile.',401);
    const res=await fetch(`${this.base}${path}`,{headers:{Authorization:`Bearer ${t}`}});
    if(res.status===401){Store.clearSession();throw new ApiErr('Session expired. Reconnect in your Profile.',401)}
    const j=await res.json().catch(()=>({}));
    if(!res.ok||j.status==='failure')throw new ApiErr(j.message||`Request failed (${res.status})`,res.status);
    return j;
  },
  search(q,type='series'){return this._get(`/search?query=${encodeURIComponent(q)}&type=${type}`)},
  seriesExtended(id){return this._get(`/series/${id}/extended`)},
  movieExtended(id){return this._get(`/movies/${id}/extended`)},
  seriesArtworks(id,type){return this._get(`/series/${id}/artworks${type!=null?`?type=${type}`:''}`)},

const ratingsCache=new Map();
let _omdbActive=0;
const _omdbQueue=[];
const OMDB_MAX_CONCURRENT=4;
function _omdbPump(){
  while(_omdbActive<OMDB_MAX_CONCURRENT&&_omdbQueue.length){
    const job=_omdbQueue.shift();
    _omdbActive++;
    job().finally(()=>{_omdbActive--;_omdbPump();});
  }
}
function omdbEnqueue(fn){
  return new Promise((resolve,reject)=>{
    _omdbQueue.push(()=>fn().then(resolve,reject));
    _omdbPump();
  });
}
async function omdbFetch(params){
  const key=(Store.omdb()||'').trim();
  if(!key)return null;
  return omdbEnqueue(async()=>{
    const qs=new URLSearchParams({...params,apikey:key});
    const res=await fetch(`https://www.omdbapi.com/?${qs.toString()}`,{method:'GET'});
    if(!res.ok){
      console.error('[nextup] OMDb request failed',res.status,res.statusText);
      throw new Error(`OMDb HTTP ${res.status}`);
    }
    const j=await res.json();
    if(j.Response==='False'){
      console.warn('[nextup] OMDb error:',j.Error);
      const err=new Error(j.Error||'OMDb error');
      err.omdbError=j.Error||'';
      throw err;
    }
    return j;
  });
}

function placeholder(){
  const svg=encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="300" height="450"><rect width="100%" height="100%" fill="#1f232e"/><text x="50%" y="50%" fill="#8b93a3" font-family="sans-serif" font-size="16" text-anchor="middle" dominant-baseline="middle">No image</text></svg>`);

document.addEventListener('error',e=>{
  const el=e.target;
  if(!(el instanceof HTMLImageElement))return;
  const ph=placeholder();
  if(el.src===ph)return;
  const tries=Number(el.dataset.retries||0);
  if(tries>=2){el.src=ph;return}
  el.dataset.retries=String(tries+1);
  const base=el.dataset.origSrc||el.src;
  el.dataset.origSrc=base;
  const bust=base.split('#')[0];
  setTimeout(()=>{el.src=bust+(bust.includes('?')?'&':'?')+'_r='+Date.now();},500*(tries+1));
},true);

function fmtDate(d){if(!d)return'TBA';const dt=new Date(d+'T00:00:00');return isNaN(dt)?d:dt.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}
function fmtRelativeDate(d){
  if(!d)return'TBA';
  const dt=new Date(d+'T00:00:00');
  if(isNaN(dt))return d;
  const today=new Date();today.setHours(0,0,0,0);
  const diffDays=Math.round((dt-today)/86400000);
  if(diffDays===0)return'Today';
  if(diffDays===1)return'Tomorrow';
  if(diffDays===-1)return'Yesterday';
  if(diffDays>1&&diffDays<7)return dt.toLocaleDateString(undefined,{weekday:'long'});
  return fmtDate(d);
}

function formatDuration(totalMinutes){
  const totalHours=Math.floor(totalMinutes/60);
  if(totalHours<24)return `${totalHours} hour${totalHours!==1?'s':''}`;
  const totalDays=Math.floor(totalHours/24);
  const hours=totalHours%24;
  if(totalDays<30)return `${totalDays} day${totalDays!==1?'s':''}, ${hours} hour${hours!==1?'s':''}`;
  const months=Math.floor(totalDays/30);
  const days=totalDays%30;
  return `${months} month${months!==1?'s':''}, ${days} day${days!==1?'s':''}, ${hours} hour${hours!==1?'s':''}`;
}

function triggerConfetti(){
  const colors=['#ffd400','#a855f7','#6fff21','#fa320a','#f5c518','#ffffff'];
  const layer=document.createElement('div');
  layer.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden';
  document.body.appendChild(layer);
  const count=90;
  for(let i=0;i<count;i++){
    const piece=document.createElement('div');
    const size=6+Math.random()*6;
    const color=colors[Math.floor(Math.random()*colors.length)];
    const startX=Math.random()*100;
    const drift=(Math.random()-0.5)*260;
    const duration=2200+Math.random()*1400;
    const delay=Math.random()*300;
    const rotStart=Math.random()*360;
    const rotEnd=rotStart+(Math.random()>0.5?1:-1)*(360+Math.random()*360);
    const round=Math.random()>0.5;
    piece.style.cssText=`position:absolute;top:-20px;left:${startX}vw;width:${size}px;height:${size*(round?1:1.6)}px;background:${color};border-radius:${round?'50%':'2px'};opacity:.95;will-change:transform,opacity;animation:confetti-fall ${duration}ms cubic-bezier(.25,.46,.45,.94) ${delay}ms forwards`;
    piece.style.setProperty('--drift',drift+'px');
    piece.style.setProperty('--rot-start',rotStart+'deg');
    piece.style.setProperty('--rot-end',rotEnd+'deg');
    layer.appendChild(piece);
  }
  setTimeout(()=>layer.remove(),4200);
}

const translationCache=new Map();
async function translateChunkNormalized(chunk){
  // MyMemory explicitly supports CORS for client-side browser use — try it first.
  try{
    const url=`https://api.mymemory.translated.net/get?q=${encodeURIComponent(chunk)}&langpair=auto|en`;
    const res=await fetch(url);
    if(!res.ok)throw new Error(`MyMemory HTTP ${res.status}`);
    const data=await res.json();
    if(data.responseStatus&&data.responseStatus!==200)throw new Error(data.responseDetails||'MyMemory error');
    const translated=data?.responseData?.translatedText;
    if(!translated)throw new Error('MyMemory returned no translation');
    const sourceLang=data?.matches?.[0]?.source||'';
    return{translated,sourceLang};
  }catch(err){
    console.warn('[nextup] MyMemory translation failed, trying Google fallback:',err.message);
  }
  const googleUrls=[
    `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=en&dt=t&q=${encodeURIComponent(chunk)}`,
    `https://translate.google.com/translate_a/single?client=gtx&sl=auto&tl=en&dt=t&q=${encodeURIComponent(chunk)}`
  ];
  let lastErr;
  for(const url of googleUrls){
    try{
      const res=await fetch(url);
      if(!res.ok)throw new Error(`Translation HTTP ${res.status}`);
      const data=await res.json();
      const translated=(data?.[0]||[]).map(seg=>seg[0]).join('');
      return{translated,sourceLang:data?.[2]||''};
    }catch(err){
      lastErr=err;
      console.warn('[nextup] translation endpoint failed, trying next:',err.message);
    }
  }
  throw lastErr||new Error('All translation providers failed');
}
async function translateToEnglish(text){
  if(translationCache.has(text))return translationCache.get(text);
  const chunks=text.match(/[\s\S]{1,450}(?:\s|$)/g)||[text];
  const parts=[];
  let sourceLang='';
  for(const chunk of chunks){
    const{translated,sourceLang:sl}=await translateChunkNormalized(chunk);
    parts.push(translated);
    sourceLang=sl||sourceLang;
  }
  const result={text:parts.join(''),sourceLang};
  translationCache.set(text,result);
  return result;
}

async function doExploreSearch(q,el){
  if(!q)return;
  if(!Store.valid()){el.innerHTML=emptyState('Connect your TVDB API key in your Profile first.','stats');return}
  el.innerHTML=loadingHtml('Searching…');
  try{
    const[seriesHits,movieHits]=await Promise.all([
      Api.search(q,'series').catch(()=>[]),
      Api.search(q,'movie').catch(()=>[])
    ]);
    if(!seriesHits.length&&!movieHits.length){el.innerHTML=emptyState(`Nothing found for "${q}".`);return}
    const combined=[];
    const maxLen=Math.max(seriesHits.length,movieHits.length);
    for(let i=0;i<maxLen;i++){
      if(seriesHits[i])combined.push({hit:seriesHits[i],kind:'series'});
      if(movieHits[i])combined.push({hit:movieHits[i],kind:'movie'});
    }
    el.innerHTML='<div id="mixed-results" class="search-results-list"></div>';
    const list=el.querySelector('#mixed-results');
    combined.forEach(({hit:h,kind})=>{
      const id=numericId(h);
      const row=searchResultRow({id,name:h.name,image:h.image_url,kind});
      list.appendChild(row);
      const imdbId=getImdbId(h);
      attachSearchRowRating(row,imdbId);
    });
  }catch(err){el.innerHTML=emptyState(err.message)}
}

async function renderWatchListTab(o){
  const allLib=Object.values(Store.lib('show'));
  if(!allLib.length){o.innerHTML=emptyState('You are not tracking any shows yet.','explore','Explore shows');return}
  o.innerHTML=loadingHtml('Loading…');
  let dataList;
  try{
    dataList=await Promise.all(allLib.map(async s=>{
      try{
        const[eps,series]=await Promise.all([getEpisodes(s.id),Api.seriesExtended(s.id).catch(()=>null)]);
        const ended=series?.status?.name==='Ended';
        return{show:s,progress:calcShowProgress(eps,ended),lastWatchedAt:calcLastWatchedAt(eps),imdbId:series?getImdbId(series):null};
      }catch{
        return{show:s,progress:{pct:0,complete:false,watched:0,total:0},lastWatchedAt:0,imdbId:null};
      }
    }));
  }catch{
    dataList=allLib.map(s=>({show:s,progress:{pct:0,complete:false,watched:0,total:0},lastWatchedAt:0,imdbId:null}));
  }
  const now=Date.now();
  const nextToWatch=[],staleList=[],notStarted=[];
  dataList.forEach(item=>{
    if(Store.isStopped('show',item.show.id))return;
    if(item.progress.complete||item.progress.upToDate)return;
    if(item.progress.watched===0){notStarted.push(item);return}
    if(now-item.lastWatchedAt>=STALE_MS){staleList.push(item);return}
    nextToWatch.push(item);
  });
  function renderCategory(title,items){
    if(!items.length)return'';
    return`<div class="cat-section"><div class="cat-box-wrap"><div class="cat-box">${title}</div></div><div class="grid" data-cat="${title}"></div></div>`;
  }
  o.innerHTML=`${renderCategory('Next to watch',nextToWatch)}${renderCategory("HAVEN'T WATCHED FOR A WHILE",staleList)}${renderCategory("Haven't started",notStarted)}`;
  function fillCategory(title,items){
    const g=o.querySelector(`.grid[data-cat="${title}"]`);
    if(!g)return;
    items.forEach(({show:s,progress,imdbId})=>{
      const card=posterCard({id:s.id,name:s.name,image:s.image,sub:'Tracking',kind:'series'});
      g.appendChild(card);
      updatePosterProgress(card,{...progress,stopped:Store.isStopped('show',s.id)});
    });
  }
  fillCategory('Next to watch',nextToWatch);
  fillCategory("HAVEN'T WATCHED FOR A WHILE",staleList);
  fillCategory("Haven't started",notStarted);
}
async function renderUpcomingTab(o){
  const allLib=Object.values(Store.lib('show'));
  if(!allLib.length){o.innerHTML=emptyState('You are not tracking any shows yet.','explore','Explore shows');return}
  o.innerHTML=loadingHtml('Loading…');

    const results=await Promise.all(allLib.map(async s=>{
      try{
        const[eps,series]=await Promise.all([getEpisodes(s.id),Api.seriesExtended(s.id).catch(()=>null)]);
        const airtime=series?.airsTime||null;
        const channel=series?.originalNetwork?.name||series?.latestNetwork?.name||null;
        return eps.filter(e=>e.aired&&isFuture(e.aired)).map(e=>({show:s,ep:e,airtime,channel}));
      }catch{return[]}
    }));
    items=results.flat();
  }catch{items=[]}
  items.sort((a,b)=>(a.ep.aired||'').localeCompare(b.ep.aired||''));

}

  nameInput.addEventListener('change',()=>{
    const v=nameInput.value.trim();
    Store.setProfile({name:v});
    nameDisplay.textContent=v||'Your name';
  });
  function readAsDataUrl(file){
    return new Promise((res,rej)=>{
      const r=new FileReader();
      r.onload=()=>res(r.result);
      r.onerror=()=>rej(r.error);
      r.readAsDataURL(file);
    });
  }
  const avatarInput=o.querySelector('#profile-avatar-input');
  avatarInput.addEventListener('change',async()=>{
    const file=avatarInput.files[0];
    if(!file)return;
    const dataUrl=await readAsDataUrl(file);
    Store.setProfile({avatar:dataUrl});
    o.querySelector('#profile-avatar-img').src=dataUrl;
  });
  const bannerInput=o.querySelector('#profile-banner-input');
  bannerInput.addEventListener('change',async()=>{
    const file=bannerInput.files[0];
    if(!file)return;
    const dataUrl=await readAsDataUrl(file);
    Store.setProfile({banner:dataUrl});
    o.querySelector('#profile-banner').style.backgroundImage=`url('${dataUrl}')`;
  });
  const editToggle=o.querySelector('#profile-edit-toggle');
  const editOverlay=o.querySelector('#profile-edit-overlay');
  const editDone=o.querySelector('#profile-edit-done');
  editToggle.addEventListener('click',e=>{
    e.stopPropagation();
    editOverlay.classList.toggle('open');
  });
  editDone.addEventListener('click',()=>editOverlay.classList.remove('open'));
  document.addEventListener('click',function onDoc(ev){
    if(!o.isConnected){document.removeEventListener('click',onDoc);return}
    if(!editOverlay.contains(ev.target)&&ev.target!==editToggle)editOverlay.classList.remove('open');
  });

  const fsmsg=o.querySelector('#fsmsg');
  const fsStatus=o.querySelector('#fs-status');
  function refreshFsStatus(connected){
    if(!FileSync.supported)return;
    fsStatus.textContent=connected?'Data file connected — your data auto-saves here on every change.':'No data file connected yet. Choose or create a .txt file to keep your data auto-saved on this device.';
  }
  if(FileSync.supported){
    refreshFsStatus(Boolean(FileSync.handle));
    o.querySelector('#fs-choose').addEventListener('click',async()=>{
      const ok=await FileSync.chooseOrCreate();
      fsmsg.textContent=ok?'Data file connected and saved.':'Could not set up the data file.';
      fsmsg.className=`msg ${ok?'ok':'err'}`;
      refreshFsStatus(ok);
    });
    o.querySelector('#fs-load').addEventListener('click',async()=>{
      const text=await FileSync.load();
      if(!text){fsmsg.textContent='No connected data file to load from. Choose one first.';fsmsg.className='msg err';return}
      try{importDataText(text);fsmsg.textContent='Data loaded from file.';fsmsg.className='msg ok';renderStats(o)}
      catch{fsmsg.textContent='That file could not be read.';fsmsg.className='msg err'}
    });
  }
  o.querySelector('#fs-download').addEventListener('click',()=>{
    downloadBackup();
    fsmsg.textContent='Backup downloaded.';fsmsg.className='msg ok';
  });
  const importInput=o.querySelector('#fs-import-input');
  o.querySelector('#fs-import').addEventListener('click',()=>importInput.click());
  importInput.addEventListener('change',async()=>{
    const file=importInput.files[0];
    if(!file)return;
    try{
      const text=await file.text();
      importDataText(text);
      fsmsg.textContent='Data imported from backup.';fsmsg.className='msg ok';
      renderStats(o);
    }catch{fsmsg.textContent='That file could not be read.';fsmsg.className='msg err'}
  });
  o.querySelector('#fs-delete').addEventListener('click',()=>{
    showConfirmDialog({
      title:'Delete local data?',
      message:'This clears your library, watched history, favorites, and ratings on this device. This cannot be undone.',
      confirmLabel:'Delete',
      danger:true,
      onConfirm:()=>{
        Object.values(K).forEach(k=>localStorage.removeItem(k));
        bumpShowsCache();
        bumpMoviesCache();
        fsmsg.textContent='Local data deleted.';fsmsg.className='msg ok';
        renderStats(o);
      }
    });
  });
}

  o.appendChild(titleRow);

    return;
  }
  o.insertAdjacentHTML('beforeend',loadingHtml('Loading…'));
  let dataList;
  try{
    dataList=await Promise.all(allLib.map(async s=>{
      try{
        const[eps,series]=await Promise.all([getEpisodes(s.id),Api.seriesExtended(s.id).catch(()=>null)]);
        const ended=series?.status?.name==='Ended';
        return{show:s,progress:calcShowProgress(eps,ended),lastWatchedAt:calcLastWatchedAt(eps),imdbId:series?getImdbId(series):null};
      }catch{
        return{show:s,progress:{pct:0,complete:false,watched:0,total:0},lastWatchedAt:0,imdbId:null};
      }
    }));
  }catch{
    dataList=allLib.map(s=>({show:s,progress:{pct:0,complete:false,watched:0,total:0},lastWatchedAt:0,imdbId:null}));
  }
  const loadingRow=o.querySelector('.loading-row');
  if(loadingRow)loadingRow.remove();
  const now=Date.now();
  const stoppedList=[],nextToWatch=[],staleList=[],completedList=[],upToDateList=[];
  dataList.forEach(item=>{
    if(Store.isStopped('show',item.show.id)){stoppedList.push(item);return}
    if(item.progress.watched===0)return;
    if(item.progress.complete){completedList.push(item);return}
    if(item.progress.upToDate){upToDateList.push(item);return}
    if(now-item.lastWatchedAt>=STALE_MS){staleList.push(item);return}
    nextToWatch.push(item);
  });
  if(!nextToWatch.length&&!staleList.length&&!stoppedList.length&&!completedList.length&&!upToDateList.length){
    o.insertAdjacentHTML('beforeend',emptyState('Nothing to show here yet.'));

  function fillCategory(title,items){
    const g=o.querySelector(`.grid[data-cat="${title}"]`);

    items.forEach(({show:s,progress,imdbId})=>{
      const card=posterCard({id:s.id,name:s.name,image:s.image,sub:'Tracking',kind:'series'});
      g.appendChild(card);
      updatePosterProgress(card,{...progress,stopped:Store.isStopped('show',s.id)});
    });
  }
  fillCategory('Next to watch',nextToWatch);
  fillCategory("HAVEN'T WATCHED FOR A WHILE",staleList);
  fillCategory('Stopped watching',stoppedList);
  fillCategory('Completed',completedList);
  fillCategory('Up to date',upToDateList);
}

let _upcomingSeq=0;
function fmtAirTime(t){
  if(!t)return null;
  const m=/^(\d{1,2}):(\d{2})/.exec(t);
  if(!m)return t;
  let h=parseInt(m[1],10);
  const min=m[2];
  const ampm=h>=12?'PM':'AM';
  h=h%12;if(h===0)h=12;
  return`${h}:${min} ${ampm}`;
}

  try{
    const[series,eps]=await Promise.all([Api.seriesExtended(id),getEpisodes(id)]);

    const ended=series.status?.name==='Ended';
    const progress=calcShowProgress(eps,ended);
    const hero=showHero(series,progress);
    const progressEl=document.createElement('div');
    progressEl.className='detail-progress-wrap';
    progressEl.innerHTML=`
      <div class="detail-progress"><div class="detail-progress-fill ${progress.complete?'complete':''} ${progress.upToDate?'uptodate':''}" style="width:${progress.pct}%"></div></div>`;
    if(Store.isStopped('show',series.id))progressEl.querySelector('.detail-progress-fill')?.classList.add('stopped');
    if(window._nxStopListener)document.removeEventListener('nx:stopchange',window._nxStopListener);
    window._nxStopListener=e=>{
      if(e.detail.kind!=='show'||e.detail.id!==series.id)return;
      progressEl.querySelector('.detail-progress-fill')?.classList.toggle('stopped',e.detail.stopped);
    };
    document.addEventListener('nx:stopchange',window._nxStopListener);
    content.style.paddingTop='';
    content.innerHTML='';
    content.appendChild(detailHeroWrap({bannerUrl,backEl:backButton(showBackRoute),heroEl:hero,progressEl}));
    const body=document.createElement('div');
    body.className='detail-body';
    const showItem={id:series.id,name:series.name,image:series.image};
    const seasonRefreshers=new Map();
    const epSeasonMap=new Map(eps.map(e=>[e.id,e.seasonNumber]));
    const continueWrap=document.createElement('div');
    function renderContinueWatching(){
      continueWrap.innerHTML='';
      const h=document.createElement('div');
      h.className='section-h';
      h.textContent='Continue Watching';
      continueWrap.appendChild(h);
      const seq=eps.filter(e=>e.seasonNumber>0).sort((a,b)=>a.seasonNumber-b.seasonNumber||a.number-b.number);
      const idx=seq.findIndex(e=>!Store.isWatched(e.id));
      const list=document.createElement('div');
      list.className='continue-watching-list';
      const allCaughtUp=idx===-1;
      const slots=allCaughtUp
        ?[seq.length>1?seq[seq.length-2]:null,seq[seq.length-1]||null,'END']
        :[idx>0?seq[idx-1]:null,seq[idx],idx+1<seq.length?seq[idx+1]:'END'];
      slots.forEach(ep=>{
        if(ep==='END'){
          list.appendChild(caughtUpMiniCard(bannerUrl));
          return;
        }
        if(!ep){
          const empty=document.createElement('div');
          empty.className='feed-item feed-item-empty';
          list.appendChild(empty);
          return;
        }
        const row=episodeRow(ep,()=>{
          updateShowProgressBar(progressEl,calcShowProgress(eps,ended));
          const allRow=body.querySelector(`.season-episodes [data-ep-id="${ep.id}"]`);
          if(allRow){
            const watched=Store.isWatched(ep.id);
            allRow.querySelector('.check')?.classList.toggle('on',watched);
            allRow.querySelector('.rewatch-group')?.classList.toggle('hidden',!watched);
          }
          seasonRefreshers.get(epSeasonMap.get(ep.id))?.();
          renderContinueWatching();
        },getImdbId(series),showItem);
        list.appendChild(row);
      });
      continueWrap.appendChild(list);
    }
    renderContinueWatching();
    body.appendChild(continueWrap);
    body.appendChild(seasonEpisodesSection(eps,series.id,()=>{updateShowProgressBar(progressEl,calcShowProgress(eps,ended));renderContinueWatching();},getImdbId(series),showItem,seasonRefreshers));
    content.appendChild(body);
  }catch(err){
    o.className='';
    content.style.paddingTop='';
    content.innerHTML='';
    content.appendChild(backButton(showBackRoute));
    content.insertAdjacentHTML('beforeend',emptyState(err.message));
  }
}
function seasonEpisodesSection(eps,showId,onProgressChange,seriesImdbId,showItem,seasonRefreshers){
  const wrap=document.createElement('div');
  const bySeason=new Map();
  eps.forEach(e=>{if(!bySeason.has(e.seasonNumber))bySeason.set(e.seasonNumber,[]);bySeason.get(e.seasonNumber).push(e)});
  const seasons=[...bySeason.keys()].sort((a,b)=>(a===0?1:0)-(b===0?1:0)||a-b);
  const h=document.createElement('div');
  h.className='section-h';
  h.textContent='All episodes';
  wrap.appendChild(h);
  if(!seasons.length){wrap.insertAdjacentHTML('beforeend',emptyState('No episode data available.'));return wrap}
  const accordion=document.createElement('div');
  accordion.className='season-accordion';
  seasons.forEach((sn,i)=>{
    const seasonEps=bySeason.get(sn).sort((a,b)=>a.number-b.number);
    const watched=seasonEps.filter(e=>Store.isWatched(e.id)).length;
    const seasonRwKey=`${showId}:${sn}`;
    const seasonRw=Store.getSeasonRewatch(seasonRwKey);
    const groupWrap=document.createElement('div');
    groupWrap.className='season-group';
    const panel=document.createElement('div');
    panel.className='season-panel';
    const seasonPct=seasonEps.length?Math.round(100*watched/seasonEps.length):0;
    panel.innerHTML=`
      <div class="season-toggle" role="button" tabindex="0" aria-expanded="false">
        <span class="season-toggle-left">
          <div class="season-toggle-title-row">
            <div class="season-toggle-title">${sn===0?'Specials':`Season ${sn}`}</div>
            <span class="season-count">${watched}/${seasonEps.length}</span>
          </div>
        </span>
        ${rewatchGroupHtml(seasonRw,watched>=seasonEps.length&&seasonEps.length>0)}
        <button type="button" class="check season-mark-btn ${watched>=seasonEps.length&&seasonEps.length?'on':''}" title="Mark season watched">✓</button>
        <svg class="season-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </div>
      <div class="season-progress"><div class="season-progress-fill ${watched>=seasonEps.length&&seasonEps.length>0?'complete':''}" style="width:${seasonPct}%"></div></div>`;
    const episodesBox=document.createElement('div');
    episodesBox.className='season-episodes';
    groupWrap.appendChild(panel);
    groupWrap.appendChild(episodesBox);
    const list=episodesBox;
    const toggle=panel.querySelector('.season-toggle');
    const markBtn=panel.querySelector('.season-mark-btn');
    const seasonRwGroup=panel.querySelector('.season-toggle .rewatch-group');
    function refreshEpisodeRewatchDisplay(){
      seasonEps.forEach(ep=>{
        const row=list.querySelector(`[data-ep-id="${ep.id}"]`);
        if(!row)return;
        const group=row.querySelector('.rewatch-group');
        if(!group)return;
        const count=Store.getEpRewatch(ep.id);
        const inc=group.querySelector('.rewatch-inc');
        const dec=group.querySelector('.rewatch-dec');
        if(inc)inc.textContent=`+${count}`;
        if(dec)dec.classList.toggle('hidden',count<1);
        group.classList.toggle('hidden',!Store.isWatched(ep.id));
      });
    }
    function refreshSeasonMeta(){
      const w=seasonEps.filter(ep=>Store.isWatched(ep.id)).length;
      panel.querySelector('.season-count').textContent=`${w}/${seasonEps.length}`;
      const pct=seasonEps.length?Math.round(100*w/seasonEps.length):0;
      const fill=panel.querySelector('.season-progress-fill');
      if(fill)fill.style.width=`${pct}%`;
      const allWatched=w>=seasonEps.length&&seasonEps.length>0;
      if(fill)fill.classList.toggle('complete',allWatched);
      markBtn.classList.toggle('on',allWatched);
      seasonRwGroup?.classList.toggle('hidden',!allWatched);
    }
    seasonEps.forEach(e=>list.appendChild(episodeRow(e,()=>{onProgressChange?.();refreshSeasonMeta()},seriesImdbId,showItem)));
    seasonRefreshers?.set(sn,refreshSeasonMeta);
    wireRewatchGroup(seasonRwGroup,{
      inc:()=>{
        const v=Store.bumpSeasonRewatch(seasonRwKey);
        seasonEps.forEach(ep=>Store.bumpEpRewatch(ep.id));
        refreshEpisodeRewatchDisplay();
        return v;
      },
      dec:()=>{
        const v=Store.decSeasonRewatch(seasonRwKey);
        seasonEps.forEach(ep=>Store.decEpRewatch(ep.id));
        refreshEpisodeRewatchDisplay();
        return v;
      }
    });
    toggle.addEventListener('click',e=>{
      if(e.target.closest('.season-mark-btn')||e.target.closest('.rewatch-group'))return;
      const open=groupWrap.classList.toggle('open');
      toggle.setAttribute('aria-expanded',open);
    });
    markBtn.addEventListener('click',e=>{
      e.stopPropagation();
      const airedEps=seasonEps.filter(ep=>ep.name&&!isFuture(ep.aired));
      if(!airedEps.length)return;
      const allWatched=airedEps.every(ep=>Store.isWatched(ep.id));
      airedEps.forEach(ep=>Store.setWatched(ep.id,!allWatched));
      list.querySelectorAll('.check').forEach(chk=>chk.classList.toggle('on',!allWatched));
      refreshSeasonMeta();
      bumpShowsCache();
      onProgressChange?.();
    });
    accordion.appendChild(groupWrap);
  });
  wrap.appendChild(accordion);
  return wrap;
}

function toYoutubeEmbed(url){
  if(!url)return null;
  try{
    const u=new URL(url);
    if(u.hostname.includes('youtu.be'))return`https://www.youtube.com/embed/${u.pathname.slice(1)}`;
    if(u.hostname.includes('youtube.com')){
      if(u.pathname==='/watch'&&u.searchParams.get('v'))return`https://www.youtube.com/embed/${u.searchParams.get('v')}`;
      if(u.pathname.startsWith('/embed/'))return url;
    }
  }catch{}
  return null;
}
async function renderMovie(o,{id}){
  o.className='detail-view';
  o.innerHTML=`<div id="content" style="padding-top:28px">${loadingHtml('Loading…')}</div>`;
  const content=o.querySelector('#content');
  try{
    const movie=await Api.movieExtended(id);
    const bannerUrl=await getBannerUrl('movie',id,movie);
    const inLib=Store.inLib('movie',movie.id);
    const stopped=Store.isStopped('movie',movie.id);
    const inFav=Store.isFav('movie',movie.id);
    const isWatched=Store.isMovieWatched(movie.id);
    const rw=Store.getRewatch('movie',movie.id);
    const hero=document.createElement('div');
    hero.className='hero';
    hero.innerHTML=`
      <img src="${imgUrl(movie.image)}" alt="${movie.name}" />
      <div class="hero-info">
        <div class="hero-title-row">
          <h2 id="title-text-movie">${movie.name}</h2>
          <div class="hero-ratings" id="ratings"><span class="rating-chip imdb">IMDb —</span></div>
        </div>
        <p class="meta-line">${movie.year?`<strong>${movie.year}</strong>`:''}${movie.runtime?` · ${movie.runtime} min`:''}</p>
        ${overviewHtml(movie.overview,'overview-text-movie')}
        <div class="row" style="margin-top:4px;flex-wrap:wrap">
          <button class="btn ${stopped?'btn-stopped':(inLib?'btn-accent':'')}" id="lib-btn">${stopped?'Stopped watching':(inLib?'✓ Added':'+ Add')}</button>
          <button class="btn ${inFav?'btn-accent':''}" id="fav-btn" style="${inLib?'':'display:none'}">${inFav?'★ Favorited':'☆ Favorite'}</button>
          <button class="btn ${isWatched?'btn-accent':''}" id="watched-btn">${isWatched?'✓ Watched':'Mark watched'}</button>
          ${rewatchGroupHtml(rw,isWatched)}
        </div>
      </div>`;
    content.style.paddingTop='';
    content.innerHTML='';
    content.appendChild(detailHeroWrap({bannerUrl,backEl:backButton(movieBackRoute),heroEl:hero}));
    wireTrackFav(hero,'movie',{id:movie.id,name:movie.name,image:movie.image});
    wireOverview(hero,'overview-text-movie',movie.overview||'No overview available.');
    wireTitleTranslate(hero,'title-text-movie',movie.name);
    hero.querySelector('#watched-btn').addEventListener('click',e=>{
      const b=e.target;
      const v=!Store.isMovieWatched(movie.id);
      Store.setMovieWatched(movie.id,v,{runtime:movie.runtime});
      b.classList.toggle('btn-accent',v);
      b.textContent=v?'✓ Watched':'Mark watched';
      hero.querySelector('.rewatch-group')?.classList.toggle('hidden',!v);
      bumpMoviesCache();
    });
    wireRewatchGroup(hero.querySelector('.rewatch-group'),{
      inc:()=>Store.bumpRewatch('movie',movie.id),
      dec:()=>Store.decRewatch('movie',movie.id)
    });
    attachRatings(hero,movie);
    const body=document.createElement('div');
    body.className='detail-body';
    const cast=(movie.characters||[]).filter(c=>c.personName||c.name);
    if(cast.length){
      const castH=document.createElement('div');
      castH.className='section-h';
      castH.textContent='Cast';
      body.appendChild(castH);
      const castTrack=document.createElement('div');
      castTrack.className='cast-track';
      cast.slice(0,25).forEach(c=>{
        const item=document.createElement('div');
        item.className='cast-item';
        item.innerHTML=`
          <img class="cast-photo" src="${imgUrl(c.image||c.personImgURL)}" alt="${c.personName||''}" />
          <div class="cast-name">${c.personName||''}</div>
          <div class="cast-role">${c.name||''}</div>`;
        castTrack.appendChild(item);
      });
      body.appendChild(castTrack);
    }
    const trailer=(movie.trailers||[])[0];
    if(trailer?.url){
      const trailerH=document.createElement('div');
      trailerH.className='section-h';
      trailerH.textContent='Trailer';
      body.appendChild(trailerH);
      const embedUrl=toYoutubeEmbed(trailer.url);
      if(embedUrl){
        const wrap=document.createElement('div');
        wrap.className='trailer-embed-wrap';
        wrap.innerHTML=`<iframe src="${embedUrl}" title="Trailer" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
        body.appendChild(wrap);
      }else{
        body.insertAdjacentHTML('beforeend',`<a class="btn" href="${trailer.url}" target="_blank" rel="noopener">▶ Watch trailer</a>`);
      }
    }
    if(body.children.length)content.appendChild(body);
  }catch(err){
    o.className='';
    content.style.paddingTop='';
    content.innerHTML='';
    content.appendChild(backButton(movieBackRoute));
    content.insertAdjacentHTML('beforeend',emptyState(err.message));
  }
}

function updateConn(err){
  const el=document.getElementById('conn');
  el.classList.remove('on','err');
  if(err)el.classList.add('err');
  else if(Store.valid())el.classList.add('on');
  updateOmdbConn();
}
function updateOmdbConn(){
  const el=document.getElementById('conn-omdb');
  el.classList.remove('on');
  if(Store.omdb())el.classList.add('on');
}

(async function boot(){
  updateConn();
  await FileSync.init();
  const key=Store.apikey();
  if(key&&!Store.valid()){
    try{await Api.login(key);updateConn()}catch{updateConn(true)}
  }
  const{route,id}=hashRoute();
  nav(route,{id});
})();

(function setupPWA(){
  try{
    const icon="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23ffd400'/%3E%3Ctext x='16' y='22.5' font-family='Poppins,Arial,sans-serif' font-weight='700' font-size='21' text-anchor='middle' fill='%232b1200'%3EN%3C/text%3E%3C/svg%3E";
    const manifest={
      name:'Nextup',short_name:'Nextup',description:"Track the shows and movies you're watching.",
      start_url:location.pathname+location.search, scope:'./', display:'standalone',
      background_color:'#000000', theme_color:'#000000',
      icons:[{src:icon,sizes:'any',type:'image/svg+xml',purpose:'any'}]
    };
    const link=document.createElement('link');
    link.rel='manifest';
    link.href='data:application/manifest+json,'+encodeURIComponent(JSON.stringify(manifest));
    document.head.appendChild(link);
  }catch{}

  if(!('serviceWorker' in navigator))return;
  if(!(location.protocol==='https:'||location.hostname==='localhost'))return;
  try{
    const swSrc=`
      const CACHE='nextup-cache-v2';
      self.addEventListener('install',e=>{e.waitUntil(self.skipWaiting())});
      self.addEventListener('activate',e=>{
        e.waitUntil(
          caches.keys()
            .then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k))))
            .then(()=>self.clients.claim())
        );
      });
      self.addEventListener('fetch',e=>{
        const req=e.request;
        if(req.method!=='GET')return;
        const url=new URL(req.url);
        if(url.origin!==self.location.origin)return;
        // Network-first: always try to get the freshest app code/data,
        // only fall back to the cache when the network is unavailable
        // (e.g. offline). This prevents a stale cached copy of the app
        // from being served on reload/restart, which previously caused
        // things like translation and ratings to silently stop working.
        e.respondWith(
          fetch(req).then(res=>{
            caches.open(CACHE).then(cache=>cache.put(req,res.clone()));
            return res;
          }).catch(()=>caches.open(CACHE).then(cache=>cache.match(req)))
        );
      });`;
    const blob=new Blob([swSrc],{type:'text/javascript'});
    const swUrl=URL.createObjectURL(blob);
    window.addEventListener('load',()=>{
      navigator.serviceWorker.register(swUrl).catch(()=>{});
    });
  }catch{}
})();
